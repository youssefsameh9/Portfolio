<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: arial, sans-serif;
        font-size: 14px;
        color: #202124;
        background: #fff;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      /* ── Top nav ── */
      .top-nav {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        padding: 14px 16px 0;
        gap: 14px;
      }

      .top-nav a {
        color: #202124;
        text-decoration: none;
        font-size: 13px;
      }

      .top-nav a:hover {
        text-decoration: underline;
      }

      .top-nav .apps-btn {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      .top-nav .apps-btn:hover {
        background: #f1f3f4;
      }

      .apps-icon {
        display: grid;
        grid-template-columns: repeat(3, 5px);
        gap: 3px;
      }

      .apps-icon span {
        width: 5px;
        height: 5px;
        background: #5f6368;
        border-radius: 50%;
        display: block;
      }

      .avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: #1a73e8;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
      }

      /* ── Main body ── */
      .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding-bottom: 100px;
      }

      /* Logo */
      .logo {
        margin-bottom: 28px;
      }

      .logo svg {
        width: 272px;
        height: 92px;
      }

      /* Search box */
      .search-wrapper {
        width: 100%;
        max-width: 584px;
        position: relative;
        margin-bottom: 24px;
      }

      .search-box {
        width: 100%;
        height: 46px;
        border: 1px solid #dfe1e5;
        border-radius: 24px;
        display: flex;
        align-items: center;
        padding: 0 14px 0 16px;
        gap: 12px;
        background: #fff;
        box-shadow: none;
        transition: box-shadow 0.2s;
        cursor: text;
      }

      .search-box:hover,
      .search-box:focus-within {
        box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
        border-color: rgba(223, 225, 229, 0);
      }

      .search-box input {
        flex: 1;
        border: none;
        outline: none;
        font-size: 16px;
        color: #202124;
        background: transparent;
      }

      .search-box .plus-icon {
        color: #9aa0a6;
        font-size: 20px;
        line-height: 1;
        cursor: pointer;
        user-select: none;
      }

      .search-icon-group {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .icon-btn {
        background: none;
        border: none;
        cursor: pointer;
        padding: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
      }

      .icon-btn:hover {
        background: #f1f3f4;
      }

      .icon-btn svg {
        width: 22px;
        height: 22px;
        fill: #9aa0a6;
      }

      .ai-mode-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border: 1px solid #dfe1e5;
        border-radius: 20px;
        font-size: 13px;
        color: #202124;
        background: #fff;
        cursor: pointer;
        white-space: nowrap;
      }

      .ai-mode-btn:hover {
        background: #f8f9fa;
      }

      .ai-star {
        width: 16px;
        height: 16px;
      }

      /* Buttons row */
      .btn-row {
        display: flex;
        gap: 12px;
        justify-content: center;
      }

      .google-btn {
        background: #f8f9fa;
        border: 1px solid #f8f9fa;
        border-radius: 4px;
        color: #3c4043;
        font-size: 14px;
        padding: 0 16px;
        height: 36px;
        cursor: pointer;
        white-space: nowrap;
      }

      .google-btn:hover {
        border-color: #dadce0;
        box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
        background: #f8f9fa;
      }

      /* Offered in */
      .offered-in {
        margin-top: 22px;
        font-size: 13px;
        color: #202124;
      }

      .offered-in a {
        color: #1a0dab;
        text-decoration: none;
      }

      .offered-in a:hover {
        text-decoration: underline;
      }

      /* ── Footer ── */
      footer {
        background: #f2f2f2;
        border-top: 1px solid #e4e4e4;
      }

      .footer-location {
        padding: 13px 24px;
        font-size: 15px;
        color: #70757a;
        border-bottom: 1px solid #e4e4e4;
      }

      .footer-links {
        display: flex;
        justify-content: space-between;
        padding: 10px 24px;
        flex-wrap: wrap;
        gap: 8px;
      }

      .footer-links-left,
      .footer-links-right {
        display: flex;
        gap: 20px;
      }

      .footer-links a {
        color: #70757a;
        text-decoration: none;
        font-size: 13px;
      }

      .footer-links a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <!-- Top nav -->
    <nav class="top-nav">
      <a href="#">Gmail</a>
      <a href="#">Images</a>
      <div class="top-nav apps-btn">
        <div class="apps-icon">
          <span></span><span></span><span></span> <span></span><span></span
          ><span></span> <span></span><span></span><span></span>
        </div>
      </div>
      <div class="avatar">U</div>
    </nav>

    <!-- Main content -->
    <main class="main">
      <!-- Google logo -->
      <div class="logo">
        <svg
          viewBox="0 0 272 92"
          xmlns="http://www.w3.org/2000/svg"
          aria-label="Google"
        >
          <path
            d="M115.75 47.18c0 12.77-9.99 22.18-22.25 22.18s-22.25-9.41-22.25-22.18C71.25 34.32 81.24 25 93.5 25s22.25 9.32 22.25 22.18zm-9.74 0c0-7.98-5.79-13.44-12.51-13.44S80.99 39.2 80.99 47.18c0 7.9 5.79 13.44 12.51 13.44s12.51-5.55 12.51-13.44z"
            fill="#EA4335"
          />
          <path
            d="M163.75 47.18c0 12.77-9.99 22.18-22.25 22.18s-22.25-9.41-22.25-22.18c0-12.85 9.99-22.18 22.25-22.18s22.25 9.32 22.25 22.18zm-9.74 0c0-7.98-5.79-13.44-12.51-13.44s-12.51 5.46-12.51 13.44c0 7.9 5.79 13.44 12.51 13.44s12.51-5.55 12.51-13.44z"
            fill="#FBBC05"
          />
          <path
            d="M209.75 26.34v39.82c0 16.38-9.66 23.07-21.08 23.07-10.75 0-17.22-7.19-19.66-13.07l8.48-3.53c1.51 3.61 5.21 7.87 11.17 7.87 7.31 0 11.84-4.51 11.84-13v-3.19h-.34c-2.18 2.69-6.38 5.04-11.68 5.04-11.09 0-21.25-9.66-21.25-22.09 0-12.52 10.16-22.26 21.25-22.26 5.29 0 9.49 2.35 11.68 4.96h.34v-3.61h9.25zm-8.56 20.92c0-7.81-5.21-13.52-11.84-13.52-6.72 0-12.35 5.71-12.35 13.52 0 7.73 5.63 13.36 12.35 13.36 6.63 0 11.84-5.63 11.84-13.36z"
            fill="#4285F4"
          />
          <path d="M225 3v65h-9.5V3h9.5z" fill="#34A853" />
          <path
            d="M262.02 54.48l7.56 5.04c-2.44 3.61-8.32 9.83-18.48 9.83-12.6 0-22.01-9.74-22.01-22.18 0-13.19 9.49-22.18 20.92-22.18 11.51 0 17.14 9.16 18.98 14.11l1.01 2.52-29.65 12.28c2.27 4.45 5.8 6.72 10.75 6.72 4.96 0 8.4-2.44 10.92-6.14zm-23.27-7.98l19.82-8.23c-1.09-2.77-4.37-4.7-8.23-4.7-4.95 0-11.84 4.37-11.59 12.93z"
            fill="#EA4335"
          />
          <path
            d="M35.29 41.41V32H67c.31 1.64.47 3.58.47 5.68 0 7.06-1.93 15.79-8.15 22.01-6.05 6.3-13.78 9.66-24.02 9.66C16.32 69.35.36 53.89.36 34.91.36 15.93 16.32.47 35.3.47c10.5 0 17.98 4.12 23.6 9.49l-6.64 6.64c-4.03-3.78-9.49-6.72-16.97-6.72-13.86 0-24.7 11.17-24.7 25.03 0 13.86 10.84 25.03 24.7 25.03 8.99 0 14.11-3.61 17.39-6.89 2.66-2.66 4.41-6.46 5.1-11.65l-22.49.01z"
            fill="#4285F4"
          />
        </svg>
      </div>

      <!-- Search -->
      <div class="search-wrapper">
        <div class="search-box">
          <span class="plus-icon">+</span>
          <input type="text" aria-label="Search" autocomplete="off" />
          <div class="search-icon-group">
            <!-- Mic -->
            <button class="icon-btn" aria-label="Search by voice">
              <svg viewBox="0 0 24 24">
                <path
                  d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"
                />
              </svg>
            </button>
            <!-- Lens -->
            <button class="icon-btn" aria-label="Search by image">
              <svg viewBox="0 0 24 24">
                <path
                  d="M9 3L7.17 5H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2h-3.17L15 3H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.65 0-3 1.35-3 3s1.35 3 3 3 3-1.35 3-3-1.35-3-3-3z"
                />
              </svg>
            </button>
            <!-- AI Mode -->
            <button class="ai-mode-btn">
              <svg class="ai-star" viewBox="0 0 24 24" fill="none">
                <path
                  d="M12 2l2.09 6.26L20 10l-5.91 1.74L12 18l-2.09-6.26L4 10l5.91-1.74L12 2z"
                  fill="#4285F4"
                />
              </svg>
              AI Mode
            </button>
          </div>
        </div>
      </div>

      <!-- Buttons -->
      <div class="btn-row">
        <button class="google-btn">Google Search</button>
        <button class="google-btn">I'm Feeling Lucky</button>
      </div>

      <!-- Offered in -->
      <p class="offered-in">Google offered in: <a href="#">العربية</a></p>
    </main>

    <!-- Footer -->
    <footer>
      <div class="footer-location">Egypt</div>
      <div class="footer-links">
        <div class="footer-links-left">
          <a href="#">About</a>
          <a href="#">Advertising</a>
          <a href="#">Business</a>
          <a href="#">How Search works</a>
        </div>
        <div class="footer-links-right">
          <a href="#">Privacy</a>
          <a href="#">Terms</a>
          <a href="#">Settings</a>
        </div>
      </div>
    </footer>
  </body>
</html>
