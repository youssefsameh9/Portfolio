<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/Portfolio/google-clone/Style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google</title>
  </head>
  <body>
    <nav>
      <ul>
        <li><a href="#gmail">Gmail</a></li>
        <li><a href="#images">Images</a></li>
        <li>
          <div class="icon-wrapper">
            <a href="#apps">
              <img src="application.png" alt="Google Apps" id="apps" />
            </a>
          </div>
        </li>
        <li>
          <a href="#pic">
            <img src="shrek.jpg" alt="Profile" id="pic" />
          </a>
        </li>
      </ul>
    </nav>
    <main>
      <div class="logo">
        <img src="google.png" alt="Google" id="logo" />
      </div>
      <div class="search-bar">
        <input id="bar" type="text" placeholder="Search Google or type a URL" />
      </div>
      <div class="buttons">
        <button>Google Search</button>
        <button>I'm Feeling Lucky</button>
      </div>
    </main>
    <div id="country">
      <span class="country">Egypt</span>
    </div>
    <footer>
      <ul class="footer-left">
        <li><a href="#">About</a></li>
        <li><a href="#">Advertising</a></li>
        <li><a href="#">Business</a></li>
        <li><a href="#">How Search works</a></li>
      </ul>
      <ul class="footer-right">
        <li><a href="#">Privacy</a></li>
        <li><a href="#">Terms</a></li>
        <li><a href="#">Settings</a></li>
      </ul>
    </footer>
  </body>
</html>
